name : "Java CI with Maven - Test and package"

on:
  pull_request:
    - branches: [main]

jobs:
  java-build:
    name: java-build
    runs-on: ubuntu-latest
    steps:
    - name: "checkout"
      uses: actions/checkout@v5
      with:
        repository: ''
    - name: "setup"
      uses: actions/setup-java@v5
      with:
        distribution: 'corretto'
        java-version: '21'
    - name: "build"
      run: mvn -B package